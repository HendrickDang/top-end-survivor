# One-click deploy on Render (render.com): New > Blueprint > pick this repo.
# Note: the free plan has no persistent disk, so scores reset when the service restarts.
# That is fine for competition day; add a disk (paid) if you want scores kept long-term.
services:
  - type: web
    name: top-end-survivor
    runtime: docker
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: ADMIN_TOKEN
        generateValue: true
      - key: PUBLIC_URL
        value: https://top-end-survivor.onrender.com/
      - key: DB_PATH
        value: /tmp/tes.sqlite
