# One-click deploy on Render (render.com): New > Blueprint > pick this repo.
# Paid plan (starter = 0.5 CPU, 512 MB) with a 1 GB persistent disk, so scores survive
# restarts and redeploys, and the server never sleeps. Render bills by the second:
# switch back to plan: free (and remove the disk) after the competition to stop paying.
services:
  - type: web
    name: top-end-survivor
    runtime: docker
    plan: starter
    healthCheckPath: /api/health
    disk:
      name: tes-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: ADMIN_TOKEN
        generateValue: true
      - key: PUBLIC_URL
        value: https://top-end-survivor.onrender.com/
      - key: DB_PATH
        value: /var/data/tes.sqlite
