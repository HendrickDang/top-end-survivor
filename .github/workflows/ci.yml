name: CI

# Runs on every push: server tests, browser smoke test, and builds the Android APK.
# Download the APK from the run's "Artifacts" section (top-end-survivor-debug-apk).
on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install server dependencies
        run: npm ci --prefix server
      - name: API tests
        run: npm test --prefix server
      - name: Browser smoke test (plays all 10 mini-games)
        run: |
          pip install playwright
          python -m playwright install --with-deps chromium
          (cd server && DB_PATH=/tmp/ci.sqlite PORT=8099 node index.js &)
          sleep 2
          python scripts/smoke_test.py http://localhost:8099 screenshots
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: screenshots
          path: screenshots/

  android:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      # GitHub's Ubuntu runner already has the Android SDK; just accept its licences.
      - name: Check Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
      - name: Install Capacitor
        run: npm ci
      - name: Copy web game into the Android project
        run: npx cap sync android
      - name: Build debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: top-end-survivor-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
